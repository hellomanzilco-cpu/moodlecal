services:
  moodle-calendar:
    build: .
    restart: unless-stopped
    init: true
    env_file: .env
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      DATABASE_PATH: /app/data/moodle-calendar.sqlite
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - moodle-calendar-data:/app/data
    stop_grace_period: 30s

volumes:
  moodle-calendar-data:
